[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ciparity"
version = "0.1.0"
description = "Compare local development conditions with declared GitHub Actions jobs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["typer>=0.16,<1", "rich>=13", "PyYAML>=6,<7", "packaging>=24"]

[project.urls]
Repository = "https://github.com/AleksZyro/CIParity"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "types-PyYAML", "build>=1.2"]

[project.scripts]
ciparity = "ciparity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
