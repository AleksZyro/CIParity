name: Publish approved release assets to PyPI
on:
  workflow_dispatch:
    inputs:
      wheel_sha256:
        description: Approved SHA-256 of the v0.1.0 wheel
        required: true
        type: string
      sdist_sha256:
        description: Approved SHA-256 of the v0.1.0 source archive
        required: true
        type: string
permissions: {}
concurrency: publish-ciparity-actions-0.1.0
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.repository == 'AleksZyro/CIParity'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify published GitHub release and approved files
        env:
          GH_TOKEN: ${{ github.token }}
          WHEEL_HASH: ${{ inputs.wheel_sha256 }}
          SDIST_HASH: ${{ inputs.sdist_sha256 }}
        run: |
          set -euo pipefail
          [[ "$WHEEL_HASH" =~ ^[[:xdigit:]]{64}$ && "$SDIST_HASH" =~ ^[[:xdigit:]]{64}$ ]]
          repo="$GITHUB_REPOSITORY"
          test "$(gh api "repos/$repo/commits/v0.1.0" --jq .sha)" = "$GITHUB_SHA"
          test "$(gh release view v0.1.0 -R "$repo" --json isDraft --jq .isDraft)" = false
          wheel=ciparity_actions-0.1.0-py3-none-any.whl
          sdist=ciparity_actions-0.1.0.tar.gz
          gh release download v0.1.0 -R "$repo" -D dist -p "$wheel" -p "$sdist"
          cd dist
          printf '%s  %s\n' "$WHEEL_HASH" "$wheel" "$SDIST_HASH" "$sdist" | sha256sum --check --strict
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: verify
    environment: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
